<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1626">
  <title>Luna</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme-init.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Rough paper edges: noise displaces the edges of card backgrounds (never text). -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <filter id="rough-edge" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="Luna">
      <a class="brand" href="#/home" aria-label="luna, home">luna</a>

      <nav class="nav" aria-label="Main">
        <a href="#/ask" data-route="ask">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path class="fill" d="M12 3.5c-5 0-9 3.2-9 7.3 0 2.2 1.2 4.2 3.1 5.5L5.3 20l4.3-2.2c.8.2 1.6.3 2.4.3 5 0 9-3.2 9-7.3S17 3.5 12 3.5z"/><circle cx="8" cy="10.8" r="1.2"/><circle cx="12" cy="10.8" r="1.2"/><circle cx="16" cy="10.8" r="1.2"/></svg>
          <span>chat with luna</span>
        </a>
        <a href="#/new" data-route="new">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path class="line" d="M6 3.5h9.5L19 7v5M15.5 3.5V7H19M19 15.5l-5.5 5.5H11v-2.5l5.5-5.5zM6 3.5A1.5 1.5 0 0 0 4.5 5v14A1.5 1.5 0 0 0 6 20.5h3M8 9h7M8 12.5h5"/></svg>
          <span>new journal</span>
        </a>
        <a href="#/checkin" data-route="checkin">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path class="fill" d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
          <span>wellness check</span>
        </a>
        <a href="#/dashboard" data-route="dashboard">
          <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path class="line" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>insights</span>
        </a>
      </nav>

      <a class="side-search" href="#/ask/search" data-route="search">search chats</a>

      <details class="saved" open>
        <summary>saved journals</summary>
        <div class="saved-box">
          <ul data-saved-journals><li class="saved-empty">nothing yet</li></ul>
          <a class="saved-all" href="#/journals/luna">all journals →</a>
        </div>
      </details>

      <a class="model-card" href="#/settings" aria-label="Change the AI model in settings">
        <span class="model-title">upgrade model</span>
        <span class="model-label">current model:</span>
        <span class="model-name" data-model-name>…</span>
      </a>

      <div class="side-bottom">
        <a class="side-link" href="#/resources" data-route="resources">resources</a>
        <a class="account" href="#/settings" data-route="settings">
          <span class="account-mark" aria-hidden="true"></span>
          <span>Account</span>
        </a>
      </div>
    </aside>

    <nav class="tabbar" aria-label="Main (mobile)">
      <a href="#/home" data-route="home">home</a>
      <a href="#/ask" data-route="ask">chat</a>
      <a href="#/new" data-route="new">journal</a>
      <a href="#/checkin" data-route="checkin">check-in</a>
      <a href="#/settings" data-route="settings">account</a>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
