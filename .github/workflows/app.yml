name: App checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check the browser JavaScript
        run: |
          for f in $(find js -name '*.js'); do
            node --check --input-type=module < "$f" || { echo "Syntax error in $f"; exit 1; }
          done

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Supabase Edge Functions
        # The root package.json is only for `npm run dev`; without this, Deno expects a node_modules folder.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check supabase/functions/*/index.ts
